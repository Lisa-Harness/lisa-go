[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lisa_packs"]
only-include = ["src/lisa_packs/go_connectors"]

[project]
name = "lisa-pack-go-connectors"
version = "0.1.0"
description = "Lisa storage and thread MCP providers backed by pinned Go binaries"
requires-python = ">=3.11"

[project.entry-points."lisa.extensions.content_roots"]
go_connectors = "lisa_packs.go_connectors:get_content_root"
