[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { root = "..", version_scheme = "no-guess-dev" }

[tool.hatch.build.targets.wheel]
packages = ["src/lisa_packs"]
only-include = ["src/lisa_packs/go_connectors"]

[project]
name = "lisa-pack-go-connectors"
dynamic = ["version"]
description = "Lisa storage, thread and memory MCP providers backed by pinned Go binaries"
requires-python = ">=3.11"

[project.entry-points."lisa.extensions.content_roots"]
go_connectors = "lisa_packs.go_connectors:get_content_root"
