version: 1

# Select these implementations with providers.capabilities.storage/thread/memory.
# The runtime downloads the release tagged with this pack's installed version
# (v<version>) on first start, verifies it against checksums.txt, and keeps it
# under the host cache directory. Install the pack from a vX.Y.Z tag.
servers:
  - server_id: lisa-storage-go
    capability: storage
    capability_tools:
      - read_file
      - read_file_range
      - write_file
      - append_file
      - list_files
      - delete_file
      - stat_file
      - make_dir
      - read_model_manifest
      - write_model_manifest
    default_available_tools:
      - read_file
      - read_file_range
      - list_files
      - stat_file
      - write_file
      - append_file
    runtime_kind: binary
    binary_download:
      repository: Lisa-Harness/lisa-go
      binary_name: lisa-storage
    warm: true
    required: true
    data_dir_subdir: "."

  - server_id: lisa-thread-go
    capability: thread
    capability_tools:
      - thread_read_range
      - thread_read_recent
      - thread_search
      - thread_read_content
      - thread_find_content
      - thread_task_view
    default_available_tools:
      - thread_read_range
      - thread_read_recent
      - thread_search
      - thread_read_content
      - thread_find_content
      - thread_task_view
    runtime_kind: binary
    binary_download:
      repository: Lisa-Harness/lisa-go
      binary_name: lisa-thread
    warm: true
    required: true
    cli_args:
      - "--thread-dir"
      - "${LISA_THREAD_DIR}"
      - "--user-slug"
      - "${LISA_USER_SLUG}"

  - server_id: lisa-memory-go
    capability: memory
    capability_tools:
      - add
      - search
      - list
    capability_optional_tools:
      - get
      - delete
      - retire
      - count
    runtime_kind: binary
    binary_download:
      repository: Lisa-Harness/lisa-go
      binary_name: lisa-memory
    warm: true
    required: true
    data_dir_subdir: "."
    # tool_map publishes the canonical memory.* contract over the native
    # wire names (published → native). The published ids are identical to
    # the synthetic alias names, so prompts and pack operations that call
    # memory.add are unchanged. Unmapped native tools stay internal-only
    # for capability servers.
    tool_map:
      add: add_memory
      search: search_memory
      list: list_memories
      get: get_memory
      delete: delete_memory
      retire: retire_memory
      count: count_memories
    # proxy_policy strips the ambient identity field (user_slug) from the
    # native tools' model-facing schema and injects it from the host
    # runtime at dispatch time — same policy the Python lisa-memory pack
    # entry carries. Without this, add_memory/search_memory would surface
    # user_slug as a settable model parameter.
    proxy_policy:
      ambient:
        user_slug: user_slug
